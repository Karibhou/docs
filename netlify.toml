# Netlify configuration file
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "NEXT_PUBLIC_BRANCH=${BRANCH:-main} npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Netlify Functions. nps.mts is the NPS relay for standalone hives
# (hivecommons/hive#9619); its logic and operator setup live in
# netlify/nps-relay/relay.ts. Hives self-register Ed25519 keys, so there is
# no per-hive setting. The only site env var is NPS_RELAY_HUB_SECRET_SHA256
# (without it the hub pull routes answer 503; hive registration and
# submissions work without any configuration, bounded by rate limits).
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/docs/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# Custom error pages
#
# public/404.html and public/403.html are fully self-contained branded error
# pages (inline CSS, no external requests) so they render correctly even
# mid-deploy when hashed asset bundles may be unavailable.
#
# NOTE: do NOT add a catch-all `from = "/*" to = "/404.html" status = 404`
# rule here. With @netlify/plugin-nextjs, netlify.toml redirects take
# precedence over Next.js routing, and a non-forced /* rule would shadow
# every server-rendered route and 404 the whole site.
# ---------------------------------------------------------------------------

# Enable branch deploys for documentation versioning
# Version branches follow the pattern: docs/{version}
[context.branch-deploy]
  command = "NEXT_PUBLIC_BRANCH=${BRANCH:-main} npm run build"

# Redirect project root pages to their first content page
