name: Documentation Issue
description: Report an issue with the documentation
title: "doc: "
labels:
  - kind/docs
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue with the documentation.

        Before opening a new issue, look for an overlapping issue that
        you could contribute to.

        Most project pages (Hive, Crux, hotshot, pluk, rationguard,
        promptargs, dibs and Spektacular) are synced from each project's own
        repository at build time — see [How content is
        sourced](https://github.com/hivecommons/docs#how-content-is-sourced).
        Fixes to that content land in the project repository; this
        repository owns site code, navigation and layout.

        Here is how you can help us serve you better:

  - type: textarea
    id: description
    attributes:
      label: Describe the issue
      description: Please describe the issue. Include relevant URLs.
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Want to contribute?
      options:
        - label: I would like to work on this issue.
          required: false
