name: Epic
description: For tracking a large feature, including how to demo it.
title: "epic: "
body:
  - type: textarea
    id: objective
    attributes:
      label: Demo Objective
      description: Please describe the objective of your demo.
      placeholder: |
        - [ ] User should be able to ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Demo Steps
      description: Please describe the steps for the demo.
      placeholder: |
        1. Admin does X
        1. User does Y
        1. Everyone is happy :)

  - type: checkboxes
    id: action-items
    attributes:
      label: Action Items
      description: Please check the following
      options:
        - label: Scope of the current demo is necessary to fit in the prototype boundaries
          required: true
        - label: Contribute to the final demo script and recording

  - type: textarea
    id: stories
    attributes:
      label: Stories
      placeholder: |
        - [ ] (Example) Add the new section to the sidebar
        - [ ] (Example) Sync the section's pages from the project repo
        - [ ] (Example) Index the new pages in search
        - [ ] (Example) **stretch-goal:** Add a landing page for the section
        - Out-of-scope: Redesign the site theme
    validations:
      required: false
