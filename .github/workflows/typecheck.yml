name: TypeScript & Lint Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Dispatched by meeting-recordings-refresh.yml: PRs it opens with GITHUB_TOKEN
  # never get pull_request runs, so it triggers this workflow on the PR branch
  # instead (#335, #337).
  workflow_dispatch:

permissions: read-all # default read; writes scoped to job below

concurrency:
  group: typecheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: TypeScript & ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # ESLint 10 uses Node util.styleText; align with build.yml/vitest.yml.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      # Pre-install typos with retries: the action's entrypoint does a single
      # unretried wget and skips it when $RUNNER_TEMP/typos is executable (#686);
      # the pinned action.yml sets INSTALL_DIR to runner.temp, not $HOME/bin.
      # The version in the key and URL must match the crate-ci/typos pin below.
      - name: Cache typos binary
        id: typos-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/typos
          key: typos-v1.52.0-${{ runner.os }}-x86_64

      - name: Install typos
        if: steps.typos-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 \
            https://github.com/crate-ci/typos/releases/download/v1.52.0/typos-v1.52.0-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" ./typos
          chmod +x "$RUNNER_TEMP/typos"

      # Spell check; config and allow-list in _typos.toml (#455).
      - name: Typos
        uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0
