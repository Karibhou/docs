name: TypeScript & Lint Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Dispatched by meeting-recordings-refresh.yml: PRs it opens with GITHUB_TOKEN
  # never get pull_request runs, so it triggers this workflow on the PR branch
  # instead (#335, #337).
  workflow_dispatch:

permissions: read-all # default read; writes scoped to job below

concurrency:
  group: typecheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: TypeScript & ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # ESLint 10 uses Node util.styleText; align with build.yml/vitest.yml.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      # Spell check; config and allow-list in _typos.toml (#455).
      - name: Typos
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
