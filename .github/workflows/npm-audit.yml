name: npm audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  # Also dispatched by meeting-recordings-refresh.yml: PRs it opens with
  # GITHUB_TOKEN never get pull_request runs, so it triggers this workflow on
  # the PR branch instead (#335, #337).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `npm audit` exits non-zero whenever any advisory exists; capture the
      # JSON and let the gate decide, so advisories with no patched release can
      # be acknowledged in .github/npm-audit-exceptions.json (with an expiry).
      - name: Run npm audit
        run: npm audit --omit=dev --json > npm-audit.json || true

      - name: Audit production dependencies
        run: npx tsx scripts/npm-audit-gate.ts npm-audit.json --level=high

      # Dev-tree advisories (markdownlint-cli2, jsdom, …) have repeatedly gone
      # unnoticed because the steps above omit devDependencies. Gate them too;
      # unpatched upstreams are acknowledged, with an expiry, in
      # .github/npm-audit-exceptions.json. Warning-only for one release
      # (ratchet, #515): drop `continue-on-error` to enforce.
      - name: Run npm audit (including devDependencies)
        run: npm audit --json > npm-audit-dev.json || true

      - name: Audit development dependencies
        continue-on-error: true
        run: npx tsx scripts/npm-audit-gate.ts npm-audit-dev.json --level=high
