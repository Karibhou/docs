name: Refresh docs/content mirrors

# The committed mirrors under docs/content/ (hive, crux, dibs, hotshot, pluk,
# promptargs, rationguard, spektacular) drift from their upstream repos between
# hand-run resyncs (#496). This mirrors meeting-recordings-refresh.yml: resync
# daily and open a signed PR when anything changed. Mirrors hivecommons/hive
# and sibling repos (crux, dibs, hotshot, pluk, promptargs, rationguard,
# spektacular) into docs/content/ via npm run sync-hive-docs and
# npm run sync-sibling-docs.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

env:
  REFRESH_BRANCH: bot/hive-docs-refresh

jobs:
  refresh:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the live tip of main rather than github.sha, which is
          # stale if the run sat in the runner queue.
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      # Both scripts fetch from hivecommons/hive@v5 and the sibling repos over
      # raw.githubusercontent.com; they fail (rather than silently keep stale
      # content) if upstream is unreachable, so a bad run opens no PR.
      # Heal mode: pages added upstream next to synced pages, or linked from
      # them, are appended to scripts/sync-hive-docs.files.json, added to the
      # nav in src/app/docs/page-map.ts, and synced (hivecommons/docs#612,
      # hivecommons/docs#625). Fails only if the heal cannot be applied.
      - run: npm run sync-hive-docs
        env:
          SYNC_HIVE_DOCS_HEAL: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run sync-sibling-docs
      - name: Mint hive App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.HIVE_APP_ID }}
          private-key: ${{ secrets.HIVE_APP_PRIVATE_KEY }}
          # Least privilege: push the refresh branch and open/update the PR.
          # Without these the token inherits every installation permission.
          permission-contents: write
          permission-pull-requests: write
      - name: Open PR with resynced mirror
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Open the PR as the hive App, not GITHUB_TOKEN: GITHUB_TOKEN-opened
          # same-repo PRs get their pull_request runs held for maintainer
          # approval (the fork-PR policy applies to them), which blocks the
          # hive sweep from merging. App-opened PRs run CI normally.
          token: ${{ steps.app-token.outputs.token }}
          signoff: true
          branch: ${{ env.REFRESH_BRANCH }}
          delete-branch: true
          add-paths: |
            docs/content
            scripts/sync-hive-docs.files.json
            src/app/docs/page-map.ts
          # Neutral on purpose: a run may change only the hive mirror, only
          # the sibling mirrors (sync-sibling-docs, from each repo's own
          # branch), or both, so the title must not name one source (#586).
          commit-message: "📖 docs: resync the docs/content mirrors from upstream"
          title: "📖 docs: resync the docs/content mirrors from upstream"
          body: |
            Automated daily resync of the committed mirrors under `docs/content/`
            via `npm run sync-hive-docs` and `npm run sync-sibling-docs`.

            Refresh run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Refs #496

            The hive sweep merges this PR once CI is green.
