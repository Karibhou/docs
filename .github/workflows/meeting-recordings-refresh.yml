name: Refresh meeting recordings

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"

permissions:
  contents: read

env:
  REFRESH_BRANCH: automation/meeting-recordings-refresh

jobs:
  refresh:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On `schedule`, github.sha is main as of trigger time. If the job sits in
          # the runner queue (run 37370568225 waited 70 min) that base is stale and
          # the PR branch is created from a stale base. Checking out the
          # branch by name fetches the live tip at job start instead.
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsx scripts/update-meeting-recordings.ts
      - name: Mint hive App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.HIVE_APP_ID }}
          private-key: ${{ secrets.HIVE_APP_PRIVATE_KEY }}
          # Least privilege: push the refresh branch and open/update the PR.
          # Without these the token inherits every installation permission.
          permission-contents: write
          permission-pull-requests: write
      - name: Open PR with recording feed snapshot
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Open the PR as the hive App, not GITHUB_TOKEN (#293, #296, #335,
          # #337): GITHUB_TOKEN-opened same-repo PRs get their pull_request
          # runs held for maintainer approval (the fork-PR policy applies to
          # them), which blocks the hive sweep from merging. App-opened PRs
          # run CI normally, so no workflow_dispatch of the checks is needed.
          token: ${{ steps.app-token.outputs.token }}
          signoff: true
          branch: ${{ env.REFRESH_BRANCH }}
          delete-branch: true
          add-paths: data/meeting-recordings.json
          commit-message: "docs: refresh community meeting recordings"
          title: "docs: refresh community meeting recordings"
          body: |
            Automated daily refresh of `data/meeting-recordings.json`.

            Refresh run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The hive sweep merges this PR once CI is green.
      - name: Trigger Netlify rebuild
        if: env.NETLIFY_BUILD_HOOK_URL != ''
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: curl --fail -sS -X POST "$NETLIFY_BUILD_HOOK_URL"
