# Typos configuration
# https://github.com/crate-ci/typos
# Run in CI by .github/workflows/typecheck.yml; run locally with `typos`.

[files]
extend-exclude = [
    "*.svg",
    # Translations, not English.
    "messages/",
    # Synced from the project repositories at build time (README "How content
    # is sourced"); fix spelling in the canonical source, not the copy.
    "docs/content/crux/",
    "docs/content/dibs/",
    "docs/content/hive/",
    "docs/content/hotshot/",
    "docs/content/pluk/",
    "docs/content/promptargs/",
    "docs/content/rationguard/",
    "docs/content/spektacular/",
    # Generated by meeting-recordings-refresh.yml; holds YouTube video IDs.
    "data/meeting-recordings.json",
]

[default.extend-words]
# "mis-" prefix, as in mis-sectioned.
mis = "mis"
# Accepted variant spelling of "unparsable".
unparseable = "unparseable"

# Add repo-specific false positives here:
# word = "word"
